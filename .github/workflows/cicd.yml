name: EasyShop CI/CD
on:
  push:
    branches:
      - sumit-cicd-k8s

jobs:
  # ==========================================
  # STAGE 1: TEST
  # ==========================================
  test:
    runs-on: [self-hosted, kind, local]
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if app code changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qv '^easyshop/\|^.github/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm install

      - name: Run Tests
        if: steps.check.outputs.changed == 'true'
        run: npm test

  # ==========================================
  # STAGE 2: BUILD
  # ==========================================
  build:
    runs-on: [self-hosted, kind, local]
    needs: test
    if: ${{ needs.test.outputs.changed == 'true' }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Build EasyShop Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/easyshop:${{ github.sha }} .

      - name: Build Migration Image
        run: docker build -f scripts/Dockerfile.migration -t ${{ secrets.DOCKER_USERNAME }}/easyshop-migration:${{ github.sha }} .

  # ==========================================
  # STAGE 3: SECURITY SCAN
  # ==========================================
  scan:
    runs-on: [self-hosted, kind, local]
    needs: [test, build]
    if: ${{ needs.test.outputs.changed == 'true' }}
    steps:
      - name: Install Trivy if not exists
        run: |
          which trivy || (
            sudo apt-get update &&
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release &&
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add - &&
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list &&
            sudo apt-get update &&
            sudo apt-get install trivy -y
          )

      - name: Trivy Security Scan
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ secrets.DOCKER_USERNAME }}/easyshop:${{ github.sha }}

  # ==========================================
  # STAGE 4: PUSH
  # ==========================================
  push:
    runs-on: [self-hosted, kind, local]
    needs: [test, scan]
    if: ${{ needs.test.outputs.changed == 'true' }}
    steps:
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push EasyShop Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/easyshop:${{ github.sha }}

      - name: Push Migration Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/easyshop-migration:${{ github.sha }}

  # ==========================================
  # STAGE 5: DEPLOY
  # ==========================================
  deploy:
    runs-on: [self-hosted, kind, local]
    needs: [test, push]
    if: ${{ always() && needs.test.result == 'success' }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Create cluster if not exists
        run: |
          if ! kind get clusters | grep -q easyshop; then
            kind create cluster --name easyshop
          fi

      - name: Deploy to Kubernetes using Helm
        run: |
          helm upgrade --install easyshop ./easyshop \
          --namespace easyshop \
          --create-namespace \
          --set image.repository=${{ secrets.DOCKER_USERNAME }}/easyshop \
          --set image.tag=${{ github.sha }} \
          --set migration.image.repository=${{ secrets.DOCKER_USERNAME }}/easyshop-migration \
          --set migration.image.tag=${{ github.sha }}
