name: EasyShop CI/CD

on:
  push:
    branches:
      - sumit-cicd-k8s

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Trivy Security Scan
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL sumit2703/easyshop:latest

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

       - name: Build EasyShop Image
        if: steps.check.outputs.changed == 'true'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/easyshop:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/easyshop:latest

      - name: Build Migration Image
        if: steps.check.outputs.changed == 'true'
        run: |
          docker build -f scripts/Dockerfile.migration -t ${{ secrets.DOCKER_USERNAME }}/easyshop-migration:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/easyshop-migration:latest

      - name: Deploy to Kubernetes using Helm
        run: |
          helm upgrade --install easyshop ./helm \
          --set image.repository=${{ secrets.DOCKER_USERNAME }}/easyshop \
          --set image.tag=latest \
          --set migration.image.repository=${{ secrets.DOCKER_USERNAME }}/easyshop-migration \
          --set migration.image.tag=latest
