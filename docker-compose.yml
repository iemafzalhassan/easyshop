version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: easyshop-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    command: npm run dev
    networks:
      - easyshop-network
    restart: always

  backend:
    build: ./backend
    container_name: easyshop-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - easyshop-network
    restart: always

  mongodb:
    image: mongo:latest
    container_name: easyshop-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - easyshop-network
    restart: always

networks:
  easyshop-network:
    driver: bridge

volumes:
  mongodb_data:
  logs:
    driver: local
