version: '3.8'

services:
  frontend:
    image: iemafzal/easyshop:latest
    container_name: easyshop-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    networks:
      - easyshop-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      maintainer: "Md. Afzal Hassan Ehsani"
      maintainer.linkedin: "https://www.linkedin.com/in/iemafzalhassan/"

  api:
    image: iemafzal/easyshop-api:latest
    container_name: easyshop-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/easyshop
      - JWT_SECRET=your_jwt_secret_here
      - PORT=8000
    networks:
      - easyshop-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s

  mongodb:
    image: mongo:latest
    container_name: easyshop-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - easyshop-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  easyshop-network:
    name: easyshop-network
    driver: bridge

volumes:
  mongodb_data:
    name: easyshop-mongodb-data